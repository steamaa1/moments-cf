# Repository-safe configuration. Workers Builds uses npm run build:cf / deploy:cf,
# which generates wrangler.build.toml from Dashboard Build Variables.
name = "moments-cf"
main = "src/index.js"
compatibility_date = "2026-08-06"

[assets]
directory = "../front/.output/public"
binding = "ASSETS"
# 动态 API、媒体及站点资源必须先交由 Worker 处理，不能被 SPA Assets 回退吞掉。
# "/*" 全匹配：HTML 页面需经 Worker 注入后台配置的 SEO meta（爬虫可见），
# 静态资源由 Worker 转发给 Assets 并保留原响应头。
run_worker_first = ["/*"]
not_found_handling = "single-page-application"

[triggers]
crons = ["0 3 * * SUN"]

[vars]
CORS_ORIGIN = "*"
# JWT_SECRET and INIT_SECRET are encrypted Worker secrets, set in the Dashboard.
